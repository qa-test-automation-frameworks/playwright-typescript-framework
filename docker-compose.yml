services:
  controlled-target:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /workspace
    command: sh -c "npm install --global npm@10.9.4 && npm ci && npm run target:start"
    environment:
      TARGET_PORT: 4300
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:?Set TEST_USER_EMAIL to a local-only seed email}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?Set TEST_USER_PASSWORD to a local-only seed password}
      TEST_USER_USERNAME: ${TEST_USER_USERNAME:?Set TEST_USER_USERNAME to a local-only seed username}
    ports:
      - '4300:4300'
    volumes:
      - .:/workspace

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    profiles: ['observability']
    command: ['--config=/etc/otelcol-contrib/config.yml']
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - '4318:4318'
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ['observability']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4317:4317'
