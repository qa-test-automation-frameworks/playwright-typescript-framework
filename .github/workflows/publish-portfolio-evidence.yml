name: Publish trusted portfolio evidence

on:
  workflow_run:
    workflows:
      - CI
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    uses: qa-test-automation-frameworks/.github/.github/workflows/publish-evidence.yml@2268817ad3741a8a7bd8db367aba7171445eb967
    with:
      source-run-id: ${{ github.event.workflow_run.id }}
      workflow-file: .github/workflows/ci.yml
