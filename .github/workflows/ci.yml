name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful QRA main workflow run ID
        required: false
        default: ''
        type: string
      candidate_artifact_id:
        description: qra-release-descriptor artifact ID from that run
        required: false
        default: ''
        type: string

env:
  CI: 'true'
  TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  PLAYWRIGHT_DOCKER_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble

jobs:
  fresh-clone-format:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run format:check

  lint-typecheck:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: framework-unit
      EVIDENCE_CLASS: hermetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
        id: native-tests
      - name: Collect framework-unit native evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs test-results/framework-unit/results.json test-results/framework-unit/evidence-v3.json
      - run: node --test scripts/evidence/*.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: framework-unit-evidence
          path: test-results/framework-unit/
          if-no-files-found: error
      - run: npm run check:secrets
      - run: npm run check:anti-patterns
      - run: npm run check:quarantine
      - run: npm run check:visual-snapshots
      - run: npm run check:openapi-contract
      - run: npm run with:target -- npm run check:env

  evidence-negative-control:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_SCOPE: evidence-negative-control
      EVIDENCE_CLASS: hermetic
      EVIDENCE_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - name: Execute real intentional native assertion failure
        id: native-tests
        continue-on-error: true
        run: npx playwright test --config=playwright.evidence-control.config.ts
      - name: Collect actual failed native execution
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs test-results/evidence-control/results.json test-results/evidence-control/evidence-v3.json
      - name: Require the intended assertion failure and failed evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/assert-control.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-negative-control
          path: test-results/evidence-control/
          if-no-files-found: error

  browser-trace-contract:
    runs-on: ubuntu-latest
    env:
      BROWSER_TRACE_CONTROL_OUT: work/evidence/browser-trace-control
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the isolated trace-retention control
        id: browser-tests
        continue-on-error: true
        run: npx playwright test --config=playwright.trace-control.config.ts
      - name: Validate the native outcomes and inspect the retained trace data
        if: always()
        env:
          NATIVE_TEST_OUTCOME: ${{ steps.browser-tests.outcome }}
        run: node scripts/evidence/validate-browser-trace-control.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-trace-contract
          path: work/evidence/browser-trace-control/
          if-no-files-found: error
          retention-days: 7

  test-api:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npm run test:api
        id: native-tests
      - name: Check API test-order independence with a reproducible shuffle seed
        run: npm run with:target -- npm run test:api:shuffle
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-api
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  test-e2e:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=chromium-authenticated --project=chromium-anonymous --shard=${{ matrix.shard }}
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          EVIDENCE_SHARD_CURRENT: ${{ matrix.shard_id == '1-of-2' && '1' || '2' }}
          EVIDENCE_SHARD_TOTAL: '2'
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-e2e-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  test-visual:
    needs: lint-typecheck
    runs-on: windows-latest
    env:
      EVIDENCE_SCOPE: visual
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run with:target -- npx playwright test --project=visual --shard=${{ matrix.shard }}
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          EVIDENCE_SHARD_CURRENT: ${{ matrix.shard_id == '1-of-2' && '1' || '2' }}
          EVIDENCE_SHARD_TOTAL: '2'
        run: node scripts/evidence/collect.mjs
      - run: npm run check:visual-snapshots
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-visual-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  test-accessibility:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: accessibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npm run test:accessibility
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-accessibility
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  test-selector-contract:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: selector-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npm run test:contracts
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-selector-contract
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  shared-app-ui:
    if: github.event_name != 'workflow_dispatch' || (inputs.candidate_run_id == '' && inputs.candidate_artifact_id == '')
    needs: lint-typecheck
    runs-on: ubuntu-latest
    env:
      EVIDENCE_SCOPE: shared-app-ui
      EVIDENCE_CLASS: controlled
      SHARED_APP_BASE_URL: http://127.0.0.1:4310
      SHARED_APP_SYNTHETIC: '1'
      APP_IMAGE: ghcr.io/qa-test-automation-frameworks/quality-reference-application@sha256:ce993056496de8daffdede281e5f0d2bfc54f44f90ba0244edd4d56dde90173c
      APP_IMAGE_DIGEST: sha256:ce993056496de8daffdede281e5f0d2bfc54f44f90ba0244edd4d56dde90173c
      APP_SOURCE_REVISION: b1851e0403f6d6a1ce12e9fde5ac5ccb3c634d94
      APP_FIXTURE_VERSION: v0.1.0
      APP_NAMESPACE: pw-${{ github.run_id }}-${{ github.run_attempt }}
      APP_POSTGRES_PASSWORD: qra-${{ github.run_id }}-${{ github.run_attempt }}-postgres
      APP_PORT: '4310'
      COMPOSE_PROJECT_NAME: pw-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull the immutable published app image and verify its source label
        run: |
          set -euo pipefail
          image_digest="${APP_IMAGE##*@}"
          [[ "$image_digest" == "$APP_IMAGE_DIGEST" ]]
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$APP_IMAGE"
          image_revision="$(docker image inspect "$APP_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$APP_SOURCE_REVISION" ]]; then
            echo "Expected app source $APP_SOURCE_REVISION, got $image_revision" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start pinned app and database in an isolated Compose project
        run: docker compose -f docker-compose.shared-app.yml up --detach
      - name: Verify isolated APP readiness and exact identity
        run: node scripts/wait-shared-app.mjs
      - name: Run shared application UI pilot
        id: native-tests
        run: npm run test:shared-app
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          EVIDENCE_TARGET_IDENTITY: quality-reference-application
          EVIDENCE_TARGET_REVISION: oci:${{ env.APP_IMAGE_DIGEST }}
          EVIDENCE_FIXTURE_VERSION: ${{ env.APP_FIXTURE_VERSION }}
          EVIDENCE_TARGET_ENVIRONMENT: isolated-github-actions
        run: node scripts/evidence/collect.mjs
      - name: Upload APP UI evidence, screenshot, and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-shared-app-ui
          path: |
            allure-results/
            test-results/
            playwright-report/shared-app/
          if-no-files-found: error
          retention-days: 7
      - name: Stop app and remove run data
        if: always()
        run: docker compose -f docker-compose.shared-app.yml down --volumes --remove-orphans

  candidate-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && (inputs.candidate_run_id != '' || inputs.candidate_artifact_id != '')
    runs-on: ubuntu-latest
    steps:
      - name: Require a paired numeric candidate selection on main
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

  candidate-shared-app-ui:
    needs: [lint-typecheck, candidate-dispatch-guard]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_run_id != '' && inputs.candidate_artifact_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVIDENCE_SCOPE: shared-app-ui
      EVIDENCE_CLASS: controlled
      SHARED_APP_BASE_URL: http://127.0.0.1:4310
      SHARED_APP_SYNTHETIC: '1'
      APP_NAMESPACE: pw-${{ github.run_id }}-${{ github.run_attempt }}
      APP_POSTGRES_PASSWORD: qra-${{ github.run_id }}-${{ github.run_attempt }}-postgres
      APP_PORT: '4310'
      COMPOSE_PROJECT_NAME: pw-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out the release descriptor verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qa-test-automation-frameworks/.github
          ref: dca03635318b3dc666175b94d08f34e898c4a4b2
          path: portfolio-assurance
          persist-credentials: false
      - name: Verify the selected QRA release descriptor
        id: release
        env:
          QRA_ACTIONS_READ_TOKEN: ${{ secrets.QRA_ACTIONS_READ_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: node portfolio-assurance/scripts/fetch-release-descriptor.mjs --run-id "$CANDIDATE_RUN_ID" --artifact-id "$CANDIDATE_ARTIFACT_ID" --output "$RUNNER_TEMP/qra-candidate.json"
      - name: Set the immutable candidate image identity
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.image_digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          FIXTURE_VERSION: ${{ steps.release.outputs.fixture_version }}
          APPLICATION_VERSION: ${{ steps.release.outputs.application_version }}
        run: |
          set -euo pipefail
          printf 'APP_IMAGE=ghcr.io/qa-test-automation-frameworks/quality-reference-application@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf 'APP_IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf 'APP_SOURCE_REVISION=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
          printf 'APP_FIXTURE_VERSION=%s\n' "$FIXTURE_VERSION" >> "$GITHUB_ENV"
          printf 'APP_APPLICATION_VERSION=%s\n' "$APPLICATION_VERSION" >> "$GITHUB_ENV"
      - name: Pull the candidate image and verify its digest and labels
        run: |
          set -euo pipefail
          [[ "${APP_IMAGE##*@}" == "$APP_IMAGE_DIGEST" ]]
          [[ "$APP_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$APP_IMAGE"
          repo_digests="$(docker image inspect "$APP_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          grep -Fx -- "$APP_IMAGE" <<< "$repo_digests"
          image_revision="$(docker image inspect "$APP_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_version="$(docker image inspect "$APP_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          [[ "$image_revision" == "$APP_SOURCE_REVISION" ]]
          [[ "$image_version" == "$APP_APPLICATION_VERSION" ]]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start candidate app and database in an isolated Compose project
        run: docker compose -f docker-compose.shared-app.yml up --detach
      - name: Verify candidate app readiness and exact identity
        run: node scripts/wait-shared-app.mjs
      - name: Run shared application UI pilot against the candidate
        id: native-tests
        run: npm run test:shared-app
      - name: Collect candidate native execution evidence
        if: always() && steps.release.outcome == 'success'
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          EVIDENCE_TARGET_IDENTITY: quality-reference-application
          EVIDENCE_TARGET_REVISION: oci:${{ steps.release.outputs.image_digest }}
          EVIDENCE_FIXTURE_VERSION: ${{ steps.release.outputs.fixture_version }}
          EVIDENCE_TARGET_ENVIRONMENT: isolated-github-actions
        run: node scripts/evidence/collect.mjs
      - name: Upload candidate APP UI evidence and reports
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-shared-app-ui
          path: |
            allure-results/
            test-results/
            playwright-report/shared-app/
          if-no-files-found: error
          retention-days: 7
      - name: Stop candidate app and remove run data
        if: always()
        run: docker compose -f docker-compose.shared-app.yml down --volumes --remove-orphans

  shared-app-rollback:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    env:
      SHARED_APP_BASE_URL: http://127.0.0.1:4311
      APP_IMAGE: ghcr.io/qa-test-automation-frameworks/quality-reference-application@sha256:284ae3fa4f2a31a4322b74a6f37e38f0d101879389c656bf1d553df7ec616469
      APP_IMAGE_DIGEST: sha256:284ae3fa4f2a31a4322b74a6f37e38f0d101879389c656bf1d553df7ec616469
      APP_SOURCE_REVISION: e9f438e06a2b092dccfc6e9ab1820ff2562ddad7
      APP_FIXTURE_VERSION: v0.1.0
      APP_NAMESPACE: pw-rollback-${{ github.run_id }}-${{ github.run_attempt }}
      APP_POSTGRES_PASSWORD: qra-${{ github.run_id }}-${{ github.run_attempt }}-rollback
      APP_PORT: '4311'
      COMPOSE_PROJECT_NAME: pw-rollback-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Pull the previous immutable image and verify its source label
        run: |
          set -euo pipefail
          [[ "${APP_IMAGE##*@}" == "$APP_IMAGE_DIGEST" ]]
          docker pull "$APP_IMAGE"
          image_revision="$(docker image inspect "$APP_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$APP_SOURCE_REVISION" ]]
      - name: Start previous image and disposable database
        run: docker compose -f docker-compose.shared-app.yml up --detach
      - name: Verify the previous pinned image preserves the v1 contract
        run: node scripts/test-shared-app-rollback.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: shared-app-rollback-proof
          path: test-results/shared-app-rollback/rollback-summary.json
          if-no-files-found: error
      - name: Stop previous image and remove run data
        if: always()
        run: docker compose -f docker-compose.shared-app.yml down --volumes --remove-orphans

  reliability-lab:
    needs: lint-typecheck
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install chromium
      - name: Require all five controlled faults to be detected
        run: npm run reliability:faults
      - name: Collect 20 independent clean target runs
        run: npm run reliability:repeat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-reliability-lab
          path: work/reliability-lab/
          if-no-files-found: error

  test-cross-browser:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: cross-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npm run test:cross-browser
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-cross-browser
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  scheduled-full-cross-browser:
    needs: lint-typecheck
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
      EVIDENCE_SCOPE: ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [firefox-regression, webkit-regression, mobile-chrome-regression]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=${{ matrix.project }}
        id: native-tests
      - name: Collect native execution evidence
        if: always()
        env:
          EVIDENCE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          EVIDENCE_REQUIRED: 'false'
        run: node scripts/evidence/collect.mjs
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports-${{ matrix.project }}
          path: |
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  generate-allure-report:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs:
      [
        evidence-negative-control,
        fresh-clone-format,
        lint-typecheck,
        scheduled-full-cross-browser,
        test-api,
        test-e2e,
        test-visual,
        test-accessibility,
        test-selector-contract,
        shared-app-ui,
        candidate-shared-app-ui,
        shared-app-rollback,
        test-cross-browser,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: reports-*
          merge-multiple: false
          path: merged-reports
      - name: Validate native evidence and every required shard
        run: node scripts/evidence/aggregate.mjs
      - name: Validate and collect every required report shard
        run: node scripts/prepare-allure-results.js
      - name: Render with the lockfile-pinned Allure CLI
        run: npm run allure:generate
      - name: Include validated execution manifests in the rendered report
        run: node -e "require('fs').copyFileSync('test-results/aggregate-evidence-v3.json','allure-report/execution-evidence-v3.json')"
      - name: Record the tested source and run
        env:
          REPORT_SOURCE_SHA: ${{ github.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "require('fs').writeFileSync('allure-report/source.json', JSON.stringify({sourceSha:process.env.REPORT_SOURCE_SHA,runUrl:process.env.REPORT_RUN_URL,runAttempt:process.env.GITHUB_RUN_ATTEMPT},null,2))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-allure-report
          path: allure-report/
          if-no-files-found: error

  required-ci:
    if: always()
    needs:
      [
        fresh-clone-format,
        lint-typecheck,
        evidence-negative-control,
        browser-trace-contract,
        test-api,
        test-e2e,
        test-visual,
        test-accessibility,
        test-selector-contract,
        shared-app-ui,
        candidate-shared-app-ui,
        shared-app-rollback,
        test-cross-browser,
        scheduled-full-cross-browser,
        reliability-lab,
        generate-allure-report,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Require substantive native success and evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/evidence/required-ci.mjs

  publish-allure-report:
    needs: [generate-allure-report, required-ci]
    if: >-
      !cancelled() &&
      needs.generate-allure-report.result == 'success' &&
      needs.required-ci.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rendered-allure-report
          path: allure-report
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: allure-report
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
