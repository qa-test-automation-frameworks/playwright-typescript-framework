name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1-5'

env:
  CI: 'true'
  TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  PLAYWRIGHT_DOCKER_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble

jobs:
  fresh-clone-format:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  lint-typecheck:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run check:secrets
      - run: npm run check:anti-patterns
      - run: npm run check:quarantine
      - run: npm run check:visual-snapshots
      - run: npm run check:openapi-contract
      - run: npm run with:target -- npm run check:env

  test-api:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:api
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-api
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-e2e:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=chromium-authenticated --project=chromium-anonymous --shard=${{ matrix.shard }}
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-e2e-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-visual:
    needs: lint-typecheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run with:target -- npx playwright test --project=visual --shard=${{ matrix.shard }}
      - run: npm run check:visual-snapshots
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-visual-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-accessibility:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:accessibility
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-accessibility
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-selector-contract:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:contracts
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-selector-contract
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-cross-browser:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:cross-browser
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-cross-browser
          path: |
            allure-results/
            test-results/
            playwright-report/

  scheduled-full-cross-browser:
    needs: lint-typecheck
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [firefox-regression, webkit-regression, mobile-chrome-regression]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=${{ matrix.project }}
      - run: npm run flake:report
        if: always()
      - run: npm run flake:check
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reports-${{ matrix.project }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  publish-allure-report:
    needs:
      [
        test-api,
        test-e2e,
        test-visual,
        test-accessibility,
        test-selector-contract,
        test-cross-browser,
      ]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: reports-*
          merge-multiple: true
          path: merged-reports
      - run: mkdir -p allure-results && find merged-reports -path '*/allure-results/*' -type f -exec cp {} allure-results/ \;
      - uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: allure-history
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
