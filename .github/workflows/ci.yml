name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1-5'

env:
  CI: 'true'
  TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  PLAYWRIGHT_DOCKER_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run check:secrets
      - run: npm run check:anti-patterns
      - run: npm run check:visual-snapshots
      - run: npm run check:openapi-contract
      - run: npm run with:target -- npm run check:env

  test-api:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:api
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-api
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-e2e:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=chromium-authenticated --project=chromium-anonymous --shard=${{ matrix.shard }}
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-e2e-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-visual:
    needs: lint-typecheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_id: '1-of-2'
          - shard: '2/2'
            shard_id: '2-of-2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run with:target -- npx playwright test --project=visual --shard=${{ matrix.shard }}
      - run: npm run check:visual-snapshots
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-visual-${{ matrix.shard_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-accessibility:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:accessibility
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-accessibility
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-selector-contract:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:contracts
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-selector-contract
          path: |
            allure-results/
            test-results/
            playwright-report/

  test-cross-browser:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npm run test:cross-browser
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-cross-browser
          path: |
            allure-results/
            test-results/
            playwright-report/

  scheduled-full-cross-browser:
    needs: lint-typecheck
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        project: [firefox-regression, webkit-regression, mobile-chrome-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run with:target -- npx playwright test --project=${{ matrix.project }}
      - run: npm run flake:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.project }}
          path: |
            allure-results/
            test-results/
            playwright-report/

  publish-allure-report:
    needs:
      [
        test-api,
        test-e2e,
        test-visual,
        test-accessibility,
        test-selector-contract,
        test-cross-browser,
      ]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: merged-reports
      - run: mkdir -p allure-results && find merged-reports -path '*/allure-results/*' -type f -exec cp {} allure-results/ \;
      - uses: simple-elf/allure-report-action@v1.14
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
