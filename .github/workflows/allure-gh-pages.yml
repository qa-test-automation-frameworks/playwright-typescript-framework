name: Allure Report Deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful default-branch CI run containing rendered-allure-report
        type: string
        required: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check trusted source run and retrieve rendered report
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected numeric source run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          node -e "const r=require('/tmp/source-run.json'); if(r.name!=='CI'||!['main','master'].includes(r.head_branch)||!['push','schedule'].includes(r.event)||r.conclusion!=='success') throw new Error('Source must be a successful trusted default-branch CI run')"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rendered-allure-report --dir allure-report
          node -e "const r=require('/tmp/source-run.json'),s=require('./allure-report/source.json'); if(s.sourceSha!==r.head_sha||s.runAttempt!==String(r.run_attempt)||s.runUrl!==process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+r.id) throw new Error('Rendered report source identity mismatch')"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: allure-report
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
