name: Rerun hosted runner setup failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun once only when failure occurred before checkout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });
            const failed = jobs.filter((job) => job.conclusion === 'failure');
            const setupOnly = failed.length > 0 && failed.every((job) => {
              const failedSteps = (job.steps || []).filter((step) => step.conclusion === 'failure');
              return failedSteps.length === 1 &&
                failedSteps[0].name === 'Set up job' &&
                !(job.steps || []).some((step) => step.name.includes('checkout') && step.status === 'completed');
            });
            if (!setupOnly) {
              core.notice('Failure reached repository or test steps; no automatic rerun.');
              return;
            }
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
